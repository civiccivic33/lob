<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lob</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
#status {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  color: #aaa; font: 14px monospace; background: rgba(0,0,0,0.7);
  padding: 6px 16px; border-radius: 8px; pointer-events: none;
  z-index: 10;
}
#cooldownBar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  width: 160px; height: 6px; background: rgba(255,255,255,0.2);
  border-radius: 3px; z-index: 10; display: none;
}
#cooldownBar div {
  height: 100%; width: 0%; background: #fff;
  border-radius: 3px; transition: width 0.1s;
}
#nickModal {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85); z-index: 100;
}
#nickModal .box {
  background: #111; border: 1px solid #333; border-radius: 12px;
  padding: 30px 40px; text-align: center;
}
#nickModal h2 {
  color: #fff; font: 18px sans-serif; margin-bottom: 16px;
}
#nickModal input {
  display: block; width: 220px; padding: 10px;
  font: 16px sans-serif; border: none; border-radius: 6px;
  text-align: center; margin-bottom: 12px; outline: none;
}
#nickModal button {
  padding: 10px 30px; font: 16px sans-serif;
  background: #fff; color: #000; border: none; border-radius: 6px;
  cursor: pointer;
}
#nickModal button:hover { background: #ddd; }
</style>
</head>
<body>
<div id="nickModal">
  <div class="box">
    <h2>Podaj nick</h2>
    <input type="text" id="nickInput" maxlength="16" autofocus>
    <button id="nickBtn">Zatwierdź</button>
  </div>
</div>
<div id="status">laczenie...</div>
<div id="cooldownBar"><div id="cooldownFill"></div></div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const nickModal = document.getElementById('nickModal');
const nickInput = document.getElementById('nickInput');
const nickBtn = document.getElementById('nickBtn');
const cooldownBar = document.getElementById('cooldownBar');
const cooldownFill = document.getElementById('cooldownFill');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const GRID_COLS = 80;
const GRID_ROWS = 50;
const FLOOR_ROW = Math.floor(0.75 * GRID_ROWS);
const COOLDOWN_MS = 3000;
const GRAVITY = 0.6;
const SPEED = 4.5;
const SPRITE_W = 40;
const SPRITE_H = 90;
const JUMP_FORCE = -10;

let floorY = H * 0.75;

let sprite = new Image();
sprite.src = 'postac.png';
let spriteLoaded = false;
sprite.onload = () => { spriteLoaded = true; };
let spriteJump = new Image();
spriteJump.src = 'postacjump.png';
let spriteJumpLoaded = false;
spriteJump.onload = () => { spriteJumpLoaded = true; };

const addedBlocks = new Set();
const removedBlocks = new Set();
let cooldownUntil = 0;

function isFilled(col, row) {
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return false;
  if (row >= FLOOR_ROW) return !removedBlocks.has(col + ',' + row);
  return addedBlocks.has(col + ',' + row);
}

let myNick = '';

const me = {
  id: null,
  x: 0, y: 0,
  vx: 0, vy: 0,
  dir: 1,
  onGround: true
};

const others = {};

const WS_URL = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'ws://localhost:3000'
  : 'wss://lob-2629.apps.hostingguru.io';

let ws;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    statusEl.textContent = 'polaczono';
    ws.send(JSON.stringify({ type: 'join', nick: myNick }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'init':
        me.id = msg.id;
        me.x = msg.xf * W;
        me.y = (H * 0.75) - SPRITE_H + (msg.yOff || 0);
        addedBlocks.clear();
        removedBlocks.clear();
        if (msg.blocks) {
          for (const k of msg.blocks.added) addedBlocks.add(k);
          for (const k of msg.blocks.removed) removedBlocks.add(k);
        }
        for (const p of msg.players) {
          if (p.id !== me.id) {
            others[p.id] = { x: p.xf * W, y: (H * 0.75) - SPRITE_H + (p.yOff || 0), nick: p.nick || '' };
          }
        }
        statusEl.textContent = 'polaczono (' + Object.keys(others).length + ' innych)';
        sendMove();
        break;
      case 'player_joined':
        if (msg.id !== me.id) {
          others[msg.id] = { x: msg.xf * W, y: (H * 0.75) - SPRITE_H + (msg.yOff || 0), nick: msg.nick || '' };
          statusEl.textContent = 'polaczono (' + Object.keys(others).length + ' innych)';
        }
        break;
      case 'player_moved':
        if (others[msg.id]) {
          others[msg.id].x = msg.xf * W;
          others[msg.id].y = (H * 0.75) - SPRITE_H + (msg.yOff || 0);
        }
        break;
      case 'player_nick':
        if (others[msg.id]) others[msg.id].nick = msg.nick;
        break;
      case 'player_left':
        delete others[msg.id];
        statusEl.textContent = 'polaczono (' + Object.keys(others).length + ' innych)';
        break;
      case 'block_place':
        if (msg.row >= FLOOR_ROW) removedBlocks.delete(msg.col + ',' + msg.row);
        else addedBlocks.add(msg.col + ',' + msg.row);
        break;
      case 'block_remove':
        if (msg.row >= FLOOR_ROW) removedBlocks.add(msg.col + ',' + msg.row);
        else addedBlocks.delete(msg.col + ',' + msg.row);
        break;
    }
  };
  ws.onclose = () => {
    statusEl.textContent = 'rozłączono, ponawiam...';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => {};
}

nickBtn.addEventListener('click', () => {
  const nick = nickInput.value.trim();
  if (!nick) return;
  myNick = nick;
  nickModal.style.display = 'none';
  connect();
});

nickInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') nickBtn.click();
});

const keys = {};
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || e.code === 'Space') {
    if (me.onGround && me.id) {
      me.vy = JUMP_FORCE;
      me.onGround = false;
    }
    e.preventDefault();
  }
});
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousedown', (e) => {
  if (!me.id) return;
  const now = Date.now();
  if (now < cooldownUntil) return;

  const col = Math.floor(e.clientX * GRID_COLS / W);
  const row = Math.floor(e.clientY * GRID_ROWS / H);
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return;

  if (e.button === 0) {
    if (isFilled(col, row)) return;
    cooldownUntil = now + COOLDOWN_MS;
    cooldownBar.style.display = 'block';
    if (row >= FLOOR_ROW) removedBlocks.delete(col + ',' + row);
    else addedBlocks.add(col + ',' + row);
    ws.send(JSON.stringify({ type: 'block_place', col, row }));
  } else if (e.button === 2) {
    if (!isFilled(col, row)) return;
    cooldownUntil = now + COOLDOWN_MS;
    cooldownBar.style.display = 'block';
    if (row >= FLOOR_ROW) removedBlocks.add(col + ',' + row);
    else addedBlocks.delete(col + ',' + row);
    ws.send(JSON.stringify({ type: 'block_remove', col, row }));
  }
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

let lastSend = 0;
function sendMove() {
  const now = Date.now();
  if (now - lastSend < 40) return;
  lastSend = now;
  const xf = me.x / W;
  const yOff = (me.y + SPRITE_H) - H * 0.75;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'move', xf, yOff }));
  }
}

function update() {
  floorY = H * 0.75;

  me.vx = 0;
  if (keys['a']) { me.vx = -SPEED; me.dir = -1; }
  if (keys['d']) { me.vx = SPEED; me.dir = 1; }

  me.vy += GRAVITY;
  me.x += me.vx;
  me.y += me.vy;

  if (me.y + SPRITE_H >= floorY) {
    me.y = floorY - SPRITE_H;
    me.vy = 0;
    me.onGround = true;
  } else {
    me.onGround = false;
  }
  if (me.x < 0) me.x = 0;
  if (me.x + SPRITE_W > W) me.x = W - SPRITE_W;

  sendMove();

  const remaining = cooldownUntil - Date.now();
  if (remaining > 0) {
    cooldownFill.style.width = (remaining / COOLDOWN_MS * 100) + '%';
  } else {
    cooldownBar.style.display = 'none';
  }
}

function drawSprite(img, x, y, w, h, dir) {
  if (dir === -1) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.scale(-1, 1);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
}

function drawNick(nick, x, y) {
  if (!nick) return;
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(nick, x + SPRITE_W / 2, y - 4);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const cellW = W / GRID_COLS;
  const cellH = H / GRID_ROWS;
  ctx.fillStyle = '#fff';
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      if (isFilled(col, row)) {
        ctx.fillRect(col * cellW, row * cellH, Math.ceil(cellW), Math.ceil(cellH));
      }
    }
  }

  ctx.imageSmoothingEnabled = false;
  for (const id in others) {
    const p = others[id];
    const airborne = p.y + SPRITE_H < floorY;
    const s = airborne && spriteJumpLoaded ? spriteJump : sprite;
    if (spriteLoaded) {
      drawSprite(s, p.x, p.y, SPRITE_W, SPRITE_H, 1);
    } else {
      ctx.fillStyle = '#f44';
      ctx.fillRect(p.x, p.y, SPRITE_W, SPRITE_H);
    }
    drawNick(p.nick, p.x, p.y);
  }

  if (me.id && spriteLoaded) {
    const s = me.onGround ? sprite : (spriteJumpLoaded ? spriteJump : sprite);
    drawSprite(s, me.x, me.y, SPRITE_W, SPRITE_H, me.dir);
  } else if (me.id) {
    ctx.fillStyle = '#4f4';
    ctx.fillRect(me.x, me.y, SPRITE_W, SPRITE_H);
  }
  drawNick(myNick, me.x, me.y);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
