<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lob</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
#status {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  color: #aaa; font: 14px monospace; background: rgba(0,0,0,0.7);
  padding: 6px 16px; border-radius: 8px; pointer-events: none;
  z-index: 10;
}
#nickModal {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85); z-index: 100;
}
#nickModal .box {
  background: #111; border: 1px solid #333; border-radius: 12px;
  padding: 30px 40px; text-align: center;
}
#nickModal h2 {
  color: #fff; font: 18px sans-serif; margin-bottom: 16px;
}
#nickModal input {
  display: block; width: 220px; padding: 10px;
  font: 16px sans-serif; border: none; border-radius: 6px;
  text-align: center; margin-bottom: 12px; outline: none;
}
#nickModal button {
  padding: 10px 30px; font: 16px sans-serif;
  background: #fff; color: #000; border: none; border-radius: 6px;
  cursor: pointer;
}
#nickModal button:hover { background: #ddd; }
</style>
</head>
<body>
<div id="nickModal">
  <div class="box">
    <h2>Podaj nick</h2>
    <input type="text" id="nickInput" maxlength="16" autofocus>
    <button id="nickBtn">Zatwierdź</button>
  </div>
</div>
<div id="status">laczenie...</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const nickModal = document.getElementById('nickModal');
const nickInput = document.getElementById('nickInput');
const nickBtn = document.getElementById('nickBtn');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const FLOOR_Y_RATIO = 0.75;
const GRAVITY = 0.6;
const SPEED = 4.5;
const SPRITE_W = 40;
const SPRITE_H = 90;

let floorY = H * FLOOR_Y_RATIO;

let sprite = new Image();
sprite.src = 'postac.png';
let spriteLoaded = false;
sprite.onload = () => { spriteLoaded = true; };

let spriteJump = new Image();
spriteJump.src = 'postacjump.png';
let spriteJumpLoaded = false;
spriteJump.onload = () => { spriteJumpLoaded = true; };

function getSprite(airborne) {
  if (airborne && spriteJumpLoaded) return spriteJump;
  return sprite;
}

let myNick = '';

const JUMP_FORCE = -10;

const me = {
  id: null,
  x: 0, y: 0,
  vx: 0, vy: 0,
  dir: 1,
  onGround: true
};

const others = {};

const WS_URL = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'ws://localhost:3000'
  : 'wss://lob-2629.apps.hostingguru.io';

let ws;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    statusEl.textContent = 'polaczono';
    ws.send(JSON.stringify({ type: 'join', nick: myNick }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'init':
        me.id = msg.id;
        me.x = msg.xf * W;
        me.y = (H * 0.75) - SPRITE_H + (msg.yOff || 0);
        for (const p of msg.players) {
          if (p.id !== me.id) {
            others[p.id] = { x: p.xf * W, y: (H * 0.75) - SPRITE_H + (p.yOff || 0), nick: p.nick || '' };
          }
        }
        statusEl.textContent = 'polaczono (' + Object.keys(others).length + ' innych)';
        sendMove();
        break;
      case 'player_joined':
        if (msg.id !== me.id) {
          others[msg.id] = { x: msg.xf * W, y: (H * 0.75) - SPRITE_H + (msg.yOff || 0), nick: msg.nick || '' };
          statusEl.textContent = 'polaczono (' + Object.keys(others).length + ' innych)';
        }
        break;
      case 'player_moved':
        if (others[msg.id]) {
          others[msg.id].x = msg.xf * W;
          others[msg.id].y = (H * 0.75) - SPRITE_H + (msg.yOff || 0);
        }
        break;
      case 'player_nick':
        if (others[msg.id]) {
          others[msg.id].nick = msg.nick;
        }
        break;
      case 'player_left':
        delete others[msg.id];
        statusEl.textContent = 'polaczono (' + Object.keys(others).length + ' innych)';
        break;
    }
  };
  ws.onclose = () => {
    statusEl.textContent = 'rozłączono, ponawiam...';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => {};
}

nickBtn.addEventListener('click', () => {
  const nick = nickInput.value.trim();
  if (!nick) return;
  myNick = nick;
  nickModal.style.display = 'none';
  connect();
});

nickInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') nickBtn.click();
});

const keys = {};
let jumpPressed = false;
document.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' && !e.repeat) { jumpPressed = true; e.preventDefault(); }
});
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

let lastSend = 0;
function sendMove() {
  const now = Date.now();
  if (now - lastSend < 40) return;
  lastSend = now;
  const xf = me.x / W;
  const yOff = (me.y + SPRITE_H) - H * 0.75;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'move', xf, yOff }));
  }
}

function update() {
  floorY = H * FLOOR_Y_RATIO;

  me.vx = 0;
  if (keys['a']) { me.vx = -SPEED; me.dir = -1; }
  if (keys['d']) { me.vx = SPEED; me.dir = 1; }

  if (jumpPressed && me.onGround) {
    me.vy = JUMP_FORCE;
    me.onGround = false;
    jumpPressed = false;
  }

  me.vy += GRAVITY;
  me.x += me.vx;
  me.y += me.vy;

  if (me.y + SPRITE_H >= floorY) {
    me.y = floorY - SPRITE_H;
    me.vy = 0;
    me.onGround = true;
  } else {
    me.onGround = false;
  }
  if (me.x < 0) me.x = 0;
  if (me.x + SPRITE_W > W) me.x = W - SPRITE_W;

  sendMove();
}

function drawSprite(img, x, y, w, h, dir) {
  if (dir === -1) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.scale(-1, 1);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
}

function drawNick(nick, x, y) {
  if (!nick) return;
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(nick, x + SPRITE_W / 2, y - 4);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, floorY, W, H - floorY);

  ctx.imageSmoothingEnabled = false;
  for (const id in others) {
    const p = others[id];
    const airborne = p.y + SPRITE_H < floorY;
    const s = airborne ? spriteJump : sprite;
    if (spriteLoaded) {
      drawSprite(s, p.x, p.y, SPRITE_W, SPRITE_H, 1);
    } else {
      ctx.fillStyle = '#f44';
      ctx.fillRect(p.x, p.y, SPRITE_W, SPRITE_H);
    }
    drawNick(p.nick, p.x, p.y);
  }

  if (me.id && spriteLoaded) {
    const s = me.onGround ? sprite : spriteJump;
    drawSprite(s, me.x, me.y, SPRITE_W, SPRITE_H, me.dir);
  } else if (me.id) {
    ctx.fillStyle = '#4f4';
    ctx.fillRect(me.x, me.y, SPRITE_W, SPRITE_H);
  }
  drawNick(myNick, me.x, me.y);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
